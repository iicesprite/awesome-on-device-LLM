summary: 面向可离线预建索引的固定上下文，以适应 Q/K 分布差异的注意力感知 ANNS 索引将多数 KV 缓存保留在 CPU，并通过 CPU–GPU 协同稀疏检索加速长上下文解码、降低显存占用。
