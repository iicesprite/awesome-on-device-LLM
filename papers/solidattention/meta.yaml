tag_note: 标签依据正式版全文，重点为 decode 阶段的 KV 布局、推测预取及异构调度；实际评测包含 Linux x86 笔记本上的 RTX 4070 Laptop CUDA 后端与 Intel Arc 140T SYCL 后端。KV 为 FP16，权重为 INT4，不把 KV 卸载或稀疏选择标成 KV 量化；未核验源码，不添加 evidence 标签。
